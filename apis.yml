description: Vathys is a deep learning hardware startup developing specialized chips
  to accelerate deep learning, focusing on data movement rather than computation
  as the main bottleneck, with the goal of a supercomputer on a chip reaching one
  petaflop on a single chip. Backed by DCVC (first investment 2018). As of July 2026
  Vathys has no discoverable live web presence (vathys.ai and related domains do
  not resolve) and publishes no public API, developer documentation, packages, or
  GitHub organization.
